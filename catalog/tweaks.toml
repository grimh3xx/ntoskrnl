[[tweak]]
id = "sec-firewall"
category = "security"
risk = "safe"
title = { pt = "Firewall ligado em todas as redes", en = "Firewall on for every network" }
description = { pt = "Liga o Firewall do Windows nas redes de domínio, privada e pública e bloqueia conexões de entrada que não têm regra. É a primeira barreira contra worms que se espalham pela rede.", en = "Turns Windows Firewall on for domain, private and public networks and blocks inbound connections without a rule. The first barrier against network worms." }
[[tweak.cmd]]
key = "fw"
backup = '''
(Get-NetFirewallProfile -ErrorAction Stop | ForEach-Object { '{0}={1}={2}' -f $_.Name, $_.Enabled, $_.DefaultInboundAction }) -join ';'
'''
apply = '''
Set-NetFirewallProfile -All -Enabled True -DefaultInboundAction Block -ErrorAction Stop
'''
verify = '''
if (@(Get-NetFirewallProfile | Where-Object { -not $_.Enabled }).Count) { 'o Firewall não ligou em todas as redes (outro firewall ou política)' } else { 'ok' }
'''
revert = '''
foreach ($p in ($env:NTOSKRNL_BACKUP -split ';')) {
  $n, $e, $d = $p -split '='
  if ($n) { Set-NetFirewallProfile -Name $n -Enabled $e -DefaultInboundAction $d -ErrorAction Stop }
}
'''

