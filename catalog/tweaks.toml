description = { pt = "Desde o Windows 10 1703, com mais de 3,5 GB de RAM, cada serviço roda no seu próprio svchost.exe (são 80 a 120 processos). Com o limite igual à sua RAM, o Windows volta a juntar os serviços em poucos svchost: menos processos e um pouco menos de memória. Ajuda de verdade em PC com 8 GB ou menos; não muda o FPS.", en = "Since Windows 10 1703, with more than 3.5 GB of RAM, each service runs in its own svchost.exe (80 to 120 processes). With the threshold set to your RAM size, Windows groups services back into a few svchost: fewer processes and a bit less memory. Really helps on PCs with 8 GB or less; it does not change FPS." }
