[[tweak]]
id = "sec-asr"
category = "security"
risk = "moderate"
title = { pt = "Regras de redução de ataque (ASR)", en = "Attack Surface Reduction rules (ASR)" }
description = { pt = "9 regras do Defender que barram as técnicas mais usadas por malware: macros do Office, scripts ofuscados, roubo de senhas da memória, drivers vulneráveis e programas sem assinatura rodando de pendrive.", en = "9 Defender rules that stop the techniques malware uses most: Office macros, obfuscated scripts, password theft from memory, vulnerable drivers and unsigned programs running from USB." }
warning = { pt = "Macros de planilhas de trabalho podem ser bloqueadas. Se isso atrapalhar, reverta.", en = "Macros in work spreadsheets may be blocked. Revert if that gets in the way." }
requires = { defender = true, not_home = true }
[[tweak.cmd]]
key = "asr"
backup = '''
$p = Get-MpPreference -ErrorAction Stop
$ids = @($p.AttackSurfaceReductionRules_Ids); $acts = @($p.AttackSurfaceReductionRules_Actions)
$o = @(); for ($i = 0; $i -lt $ids.Count; $i++) { if ($ids[$i]) { $o += '{0}={1}' -f $ids[$i], [int]$acts[$i] } }
$o -join ';'
'''
apply = '''
$ids = @('56a863a9-875e-4185-98a7-b882c64b5ce5','9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2','e6db77e5-3df2-4cf1-b95a-636979351e5b','c1db55ab-c21a-4637-bb3f-a12568109d35','be9ba2d9-53ea-4cdc-84e5-9b1eeee46550','d4f940ab-401b-4efc-aadc-ad5f3c50688a','d3e037e1-3eb8-44c8-a917-57927947596d','5beb7efe-fd9a-4556-801d-275e5ffc04cc','b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4')
Add-MpPreference -AttackSurfaceReductionRules_Ids $ids -AttackSurfaceReductionRules_Actions ($ids | ForEach-Object { 'Enabled' }) -ErrorAction Stop
'''
verify = '''
$p = Get-MpPreference
$ids = @($p.AttackSurfaceReductionRules_Ids); $acts = @($p.AttackSurfaceReductionRules_Actions)
$on = @(for ($i = 0; $i -lt $ids.Count; $i++) { if ($acts[$i] -eq 1) { [string]$ids[$i] } })
if (@(@('56a863a9-875e-4185-98a7-b882c64b5ce5','9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2','e6db77e5-3df2-4cf1-b95a-636979351e5b','c1db55ab-c21a-4637-bb3f-a12568109d35','be9ba2d9-53ea-4cdc-84e5-9b1eeee46550','d4f940ab-401b-4efc-aadc-ad5f3c50688a','d3e037e1-3eb8-44c8-a917-57927947596d','5beb7efe-fd9a-4556-801d-275e5ffc04cc','b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4') | Where-Object { $on -notcontains $_ }).Count) { 'o Defender recusou a mudança (Proteção contra Adulteração ou política da empresa)' } else { 'ok' }
'''
revert = '''
$prev = @{}
foreach ($x in ($env:NTOSKRNL_BACKUP -split ';')) { if ($x) { $k, $v = $x -split '='; $prev[$k.ToLower()] = [int]$v } }
foreach ($id in @('56a863a9-875e-4185-98a7-b882c64b5ce5','9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2','e6db77e5-3df2-4cf1-b95a-636979351e5b','c1db55ab-c21a-4637-bb3f-a12568109d35','be9ba2d9-53ea-4cdc-84e5-9b1eeee46550','d4f940ab-401b-4efc-aadc-ad5f3c50688a','d3e037e1-3eb8-44c8-a917-57927947596d','5beb7efe-fd9a-4556-801d-275e5ffc04cc','b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4')) {
  if ($prev.ContainsKey($id)) { Add-MpPreference -AttackSurfaceReductionRules_Ids $id -AttackSurfaceReductionRules_Actions $prev[$id] -ErrorAction Stop }
  else { Remove-MpPreference -AttackSurfaceReductionRules_Ids $id -ErrorAction Stop }
}
'''

