[[tweak.cmd]]
key = "sysfx"
backup = '''
$FX = '{1da5d803-d492-4edd-8c23-e0c0ffee7f0e},5'
function Get-CTAudioFx {
  Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render' -ErrorAction SilentlyContinue | ForEach-Object {
    if ((Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DeviceState -ne 1) { return } # 1 = ativa
    $fx = Join-Path $_.PSPath 'FxProperties'
    if (Test-Path $fx) { [pscustomobject]@{ id = $_.PSChildName; fx = $fx } }
  }
}
$o = @{}
foreach ($e in Get-CTAudioFx) {
  $v = (Get-ItemProperty $e.fx -Name $FX -ErrorAction SilentlyContinue).$FX
  $o[$e.id] = if ($null -eq $v) { '__none__' } else { [string]$v }
}
$o | ConvertTo-Json -Compress
'''
apply = '''
$FX = '{1da5d803-d492-4edd-8c23-e0c0ffee7f0e},5'
function Get-CTAudioFx {
  Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render' -ErrorAction SilentlyContinue | ForEach-Object {
    if ((Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DeviceState -ne 1) { return } # 1 = ativa
    $fx = Join-Path $_.PSPath 'FxProperties'
    if (Test-Path $fx) { [pscustomobject]@{ id = $_.PSChildName; fx = $fx } }
  }
}
$ok = 0; $n = 0
foreach ($e in Get-CTAudioFx) {
  $n++
  try { Set-ItemProperty $e.fx -Name $FX -Value 1 -Type DWord -ErrorAction Stop; $ok++ } catch {}
}
if ($n -gt 0 -and $ok -eq 0) { throw 'O Windows não deixou mudar os efeitos de áudio' }
Restart-Service Audiosrv -Force -ErrorAction SilentlyContinue
'''
