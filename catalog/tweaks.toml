[[tweak]]
id = "nvidia-hdcp-off"
category = "gpu"
risk = "advanced"
restart = true
title = { pt = "Desativar HDCP (NVIDIA)", en = "Disable HDCP (NVIDIA)" }
summary = { pt = "Tira uma proteção de vídeo que pesa em algumas placas NVIDIA. Netflix e afins podem parar de abrir.", en = "Removes a video protection that weighs on some NVIDIA cards. Netflix and similar may stop working." }
description = { pt = "Remove a verificação de proteção de conteúdo do driver NVIDIA, que pode causar pequenos travamentos.", en = "Removes the NVIDIA driver content-protection handshake, which can cause small hitches." }
warning = { pt = "Netflix, Prime Video e outros serviços com DRM podem não tocar em HD.", en = "Netflix, Prime Video and other DRM services may not play in HD." }
requires = { gpu = "nvidia" }
[[tweak.cmd]]
key = "hdcp"
apply = '''
Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}' -ErrorAction SilentlyContinue |
  Where-Object { (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).ProviderName -match 'NVIDIA' } |
  ForEach-Object { Set-ItemProperty $_.PSPath -Name RMHdcpKeyglobZero -Value 1 -Type DWord }
'''
verify = '''
if (@(Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}' -ErrorAction SilentlyContinue | Where-Object { (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).ProviderName -match 'NVIDIA' } | Where-Object { (Get-ItemProperty $_.PSPath).RMHdcpKeyglobZero -ne 1 }).Count) { 'o driver NVIDIA não aceitou' } else { 'ok' }
'''
revert = '''
Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}' -ErrorAction SilentlyContinue |
  ForEach-Object { Remove-ItemProperty -Path $_.PSPath -Name RMHdcpKeyglobZero -ErrorAction SilentlyContinue }
'''

[[tweak]]
id = "msi-mode"
category = "gpu"
risk = "advanced"
restart = true
title = { pt = "Modo MSI para placa de vídeo e de rede", en = "MSI mode for graphics and network cards" }
summary = { pt = "Placa de vídeo e de rede interrompem menos o processador: menos chance de travadinhas.", en = "Graphics and network cards interrupt the CPU less: lower chance of microstutter." }
description = { pt = "As placas avisam o processador por mensagem (Message Signaled Interrupts) em vez da linha de interrupção compartilhada. Reduz o tempo que o processador gasta atendendo drivers, uma causa de travadinhas. Placas e drivers recentes já usam MSI: nesses casos nada muda. Só mexe na placa de vídeo e na de rede, que sempre aceitam.", en = "The cards signal the CPU with messages (Message Signaled Interrupts) instead of the shared interrupt line. Cuts the time the CPU spends serving drivers, one cause of microstutter. Recent cards and drivers already use MSI: then nothing changes. Only touches the graphics and network cards, which always support it." }
warning = { pt = "Raramente, um driver antigo não inicia em MSI (tela preta ou sem internet depois de reiniciar). Se acontecer, reverta pelo app ou no Modo de Segurança.", en = "Rarely, an old driver fails to start in MSI mode (black screen or no internet after restart). If so, revert it in the app or in Safe Mode." }
[[tweak.cmd]]
key = "msi"
backup = '''
$o = @{}
Get-PnpDevice -PresentOnly -ErrorAction SilentlyContinue | Where-Object { ($_.Class -eq 'Display' -or $_.Class -eq 'Net') -and $_.InstanceId -like 'PCI\*' } | ForEach-Object {
  $k = "HKLM:\SYSTEM\CurrentControlSet\Enum\$($_.InstanceId)\Device Parameters\Interrupt Management\MessageSignaledInterruptProperties"
  $v = (Get-ItemProperty $k -ErrorAction SilentlyContinue).MSISupported
  $o[$_.InstanceId] = if ($null -eq $v) { '__none__' } else { [string]$v }
}
$o | ConvertTo-Json -Compress
'''
apply = '''
Get-PnpDevice -PresentOnly -ErrorAction SilentlyContinue | Where-Object { ($_.Class -eq 'Display' -or $_.Class -eq 'Net') -and $_.InstanceId -like 'PCI\*' } | ForEach-Object {
  $k = "HKLM:\SYSTEM\CurrentControlSet\Enum\$($_.InstanceId)\Device Parameters\Interrupt Management\MessageSignaledInterruptProperties"
  if (-not (Test-Path $k)) { New-Item $k -Force | Out-Null }
  Set-ItemProperty $k -Name MSISupported -Value 1 -Type DWord
}
'''
verify = '''
$bad = @()
Get-PnpDevice -PresentOnly -ErrorAction SilentlyContinue | Where-Object { ($_.Class -eq 'Display' -or $_.Class -eq 'Net') -and $_.InstanceId -like 'PCI\*' } | ForEach-Object {
  $k = "HKLM:\SYSTEM\CurrentControlSet\Enum\$($_.InstanceId)\Device Parameters\Interrupt Management\MessageSignaledInterruptProperties"
  if ((Get-ItemProperty $k -ErrorAction SilentlyContinue).MSISupported -ne 1) { $bad += $_.FriendlyName }
}
if ($bad.Count) { 'o Windows não deixou mudar: ' + ($bad -join ', ') } else { 'ok' }
'''
revert = '''
if (-not $env:NTOSKRNL_BACKUP) { return }
($env:NTOSKRNL_BACKUP | ConvertFrom-Json).PSObject.Properties | ForEach-Object {
  $k = "HKLM:\SYSTEM\CurrentControlSet\Enum\$($_.Name)\Device Parameters\Interrupt Management\MessageSignaledInterruptProperties"
  if ($_.Value -eq '__none__') { Remove-ItemProperty $k -Name MSISupported -ErrorAction SilentlyContinue }
  elseif (Test-Path $k) { Set-ItemProperty $k -Name MSISupported -Value ([int]$_.Value) -Type DWord }
}
'''

[[tweak]]
id = "windowed-game-optimizations"
category = "gpu"
risk = "safe"
title = { pt = "Otimizações para jogos em janela", en = "Optimizations for windowed games" }
summary = { pt = "Jogos em janela sem borda com menos atraso, quase igual à tela cheia.", en = "Borderless windowed games with less delay, almost like fullscreen." }
description = { pt = "Jogos em janela ou tela cheia sem borda usam o modo de apresentação moderno (flip model): menos latência e suporte a VRR/G-Sync em janela.", en = "Windowed and borderless games use the modern flip presentation model: lower latency and VRR/G-Sync support in windowed mode." }
requires = { min_build = 22000 }
[[tweak.cmd]]
key = "dxswap"
backup = '''
$v = (Get-ItemProperty 'HKCU:\Software\Microsoft\DirectX\UserGpuPreferences' -ErrorAction SilentlyContinue).DirectXUserGlobalSettings
if ($null -eq $v) { '__none__' } else { 'v:' + $v }
'''
apply = '''
$p = 'HKCU:\Software\Microsoft\DirectX\UserGpuPreferences'
if (-not (Test-Path $p)) { New-Item $p -Force | Out-Null }
$v = [string](Get-ItemProperty $p -ErrorAction SilentlyContinue).DirectXUserGlobalSettings
$v = $v -replace 'SwapEffectUpgradeEnable=[^;]*;?', ''
Set-ItemProperty $p -Name DirectXUserGlobalSettings -Value ($v + 'SwapEffectUpgradeEnable=1;') -Type String
'''
verify = '''
if ([string](Get-ItemProperty 'HKCU:\Software\Microsoft\DirectX\UserGpuPreferences' -ErrorAction SilentlyContinue).DirectXUserGlobalSettings -match 'SwapEffectUpgradeEnable=1;') { 'ok' } else { 'a opção de gráficos não foi gravada' }
'''
revert = '''
$b = $env:NTOSKRNL_BACKUP
if (-not $b) { return }
$p = 'HKCU:\Software\Microsoft\DirectX\UserGpuPreferences'
$v = [string](Get-ItemProperty $p -ErrorAction SilentlyContinue).DirectXUserGlobalSettings
$v = $v -replace 'SwapEffectUpgradeEnable=[^;]*;?', ''
# devolve só a nossa opção ao que era antes (as outras podem ter mudado nesse meio-tempo)
if ($b.StartsWith('v:') -and $b -match 'SwapEffectUpgradeEnable=([^;]*)') { $v += 'SwapEffectUpgradeEnable=' + $Matches[1] + ';' }
if ($v) { Set-ItemProperty $p -Name DirectXUserGlobalSettings -Value $v -Type String }
elseif ($b -eq '__none__') { Remove-ItemProperty $p -Name DirectXUserGlobalSettings -ErrorAction SilentlyContinue }
else { Set-ItemProperty $p -Name DirectXUserGlobalSettings -Value '' -Type String }
'''

