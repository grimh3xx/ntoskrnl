# Catálogo de tweaks. Cada valor de registro e serviço tem backup automático antes de mudar;
# comandos trazem o próprio backup/revert/verify. O backup chega no PowerShell em $env:NTOSKRNL_BACKUP.

[[tweak]]
id = "power-throttling-off"
category = "power"
risk = "moderate"
title = { pt = "Desativar Power Throttling", en = "Disable Power Throttling" }
summary = { pt = "Programas abertos atrás do jogo (Discord, OBS) não ficam lentos.", en = "Apps running behind the game (Discord, OBS) do not slow down." }
description = { pt = "Impede o Windows de reduzir o clock de processos em segundo plano (ex.: Discord, OBS) enquanto você joga.", en = "Stops Windows from throttling background processes (e.g. Discord, OBS) while you play." }
warning = { pt = "Em notebooks, aumenta o consumo de bateria.", en = "On laptops, increases battery drain." }
requires = { desktop_only = true }
[[tweak.reg]]
path = "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Power\\PowerThrottling"
name = "PowerThrottlingOff"
type = "REG_DWORD"
value = 1

[[tweak]]
id = "usb-suspend-off"
category = "power"
risk = "safe"
title = { pt = "USB sem suspensão seletiva", en = "USB selective suspend off" }
summary = { pt = "Mouse, teclado e headset não somem nem cortam por economia de energia.", en = "Mouse, keyboard and headset no longer drop out or cut from power saving." }
description = { pt = "Na tomada, o Windows para de \"adormecer\" as portas USB sem uso. Resolve mouse, teclado ou headset que somem por um instante ou cortam o áudio, e a primeira tecla que demora a responder.", en = "On AC power, Windows stops putting idle USB ports to sleep. Fixes mice, keyboards or headsets that drop out for a moment or cut audio, and the first key press that responds late." }
[[tweak.cmd]]
key = "usbsuspend"
backup = '''
$q = powercfg /query SCHEME_CURRENT 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 2>$null | Out-String
$m = [regex]::Matches($q, '0x([0-9a-fA-F]{8})')
if ($m.Count -ge 2) { [Convert]::ToInt64($m[$m.Count - 2].Groups[1].Value, 16) }
'''
apply = '''
powercfg /setacvalueindex SCHEME_CURRENT 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 0 | Out-Null
powercfg /setactive SCHEME_CURRENT | Out-Null
'''
verify = '''
$q = powercfg /query SCHEME_CURRENT 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 2>$null | Out-String
$m = [regex]::Matches($q, '0x([0-9a-fA-F]{8})')
if ($m.Count -ge 2 -and [Convert]::ToInt64($m[$m.Count - 2].Groups[1].Value, 16) -eq 0) { 'ok' } else { 'o Windows não aceitou a opção do plano de energia' }
'''
revert = '''
if ($env:NTOSKRNL_BACKUP -match '^\d+$') {
  powercfg /setacvalueindex SCHEME_CURRENT 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 $env:NTOSKRNL_BACKUP | Out-Null
  powercfg /setactive SCHEME_CURRENT | Out-Null
}
'''

[[tweak]]
id = "pcie-aspm-off"
category = "power"
risk = "safe"
title = { pt = "PCI Express sem economia de energia", en = "PCI Express power saving off" }
summary = { pt = "Menos travadinhas ao carregar áreas e abrir menus do jogo.", en = "Fewer hitches when loading areas and opening game menus." }
