warning = { pt = "Pode levar alguns minutos em bibliotecas grandes.", en = "May take a few minutes on big libraries." }
[[tweak.cmd]]
key = "index"
backup = '''
function Get-CTGameLibs {
  $libs = @()
  $steam = (Get-ItemProperty 'HKCU:\Software\Valve\Steam' -ErrorAction SilentlyContinue).SteamPath
  if ($steam) {
    $vdf = Join-Path $steam 'steamapps\libraryfolders.vdf'
    if (Test-Path $vdf) {
      foreach ($m in (Select-String -Path $vdf -Pattern '"path"\s+"([^"]+)"')) { $libs += Join-Path ($m.Matches[0].Groups[1].Value -replace '\\\\', '\') 'steamapps\common' }
    }
  }
  Get-ChildItem "$env:ProgramData\Epic\EpicGamesLauncher\Data\Manifests" -Filter '*.item' -ErrorAction SilentlyContinue | ForEach-Object {
    try { $j = Get-Content $_.FullName -Raw | ConvertFrom-Json; if ($j.InstallLocation) { $libs += [string]$j.InstallLocation } } catch {}
  }
  @($libs | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique)
}
@(Get-CTGameLibs) | ConvertTo-Json -Compress
'''
