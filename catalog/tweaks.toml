[[tweak.cmd]]
key = "aspm"
backup = '''
$q = powercfg /query SCHEME_CURRENT 501a4d13-42af-4429-9fd1-a8218c268e20 ee12f906-d277-404b-b6da-e5fa1a576df5 2>$null | Out-String
$m = [regex]::Matches($q, '0x([0-9a-fA-F]{8})')
if ($m.Count -ge 2) { [Convert]::ToInt64($m[$m.Count - 2].Groups[1].Value, 16) }
'''
apply = '''
powercfg /setacvalueindex SCHEME_CURRENT 501a4d13-42af-4429-9fd1-a8218c268e20 ee12f906-d277-404b-b6da-e5fa1a576df5 0 | Out-Null
powercfg /setactive SCHEME_CURRENT | Out-Null
'''
verify = '''
$q = powercfg /query SCHEME_CURRENT 501a4d13-42af-4429-9fd1-a8218c268e20 ee12f906-d277-404b-b6da-e5fa1a576df5 2>$null | Out-String
$m = [regex]::Matches($q, '0x([0-9a-fA-F]{8})')
if ($m.Count -ge 2 -and [Convert]::ToInt64($m[$m.Count - 2].Groups[1].Value, 16) -eq 0) { 'ok' } else { 'o Windows não aceitou a opção do plano de energia' }
'''
revert = '''
if ($env:NTOSKRNL_BACKUP -match '^\d+$') {
  powercfg /setacvalueindex SCHEME_CURRENT 501a4d13-42af-4429-9fd1-a8218c268e20 ee12f906-d277-404b-b6da-e5fa1a576df5 $env:NTOSKRNL_BACKUP | Out-Null
  powercfg /setactive SCHEME_CURRENT | Out-Null
}
'''

