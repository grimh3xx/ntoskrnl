  if ($types -notcontains $type) { return '__none__' }
  $e = (Invoke-CimMethod -InputObject $o -MethodName GetElement -Arguments @{ Type = $type }).Element
  if ($e.CimInstanceProperties['Boolean']) { if ($e.Boolean) { 'yes' } else { 'no' } } else { [string]$e.Integer }
}
if ((Get-CTBcd 0x260000A5) -eq 'yes') { 'ok' } else { 'a inicialização do Windows não ficou com a mudança' }
'''
revert = '''
$bl = Get-CimInstance -Namespace root/cimv2/Security/MicrosoftVolumeEncryption -ClassName Win32_EncryptableVolume -ErrorAction SilentlyContinue |
  Where-Object { $_.DriveLetter -eq $env:SystemDrive }
if ($bl -and $bl.ProtectionStatus -eq 1) { manage-bde -protectors -disable $env:SystemDrive -RebootCount 1 | Out-Null }
if ($env:NTOSKRNL_BACKUP -ne 'yes') { bcdedit /deletevalue disabledynamictick | Out-Null }
'''

