[[tweak.cmd]]
key = "bcd"
backup = '''
function Get-CTBcd([uint32]$type) {
  $st = (Invoke-CimMethod -Namespace root/wmi -ClassName BcdStore -MethodName OpenStore -Arguments @{ File = '' }).Store
  $o = (Invoke-CimMethod -InputObject $st -MethodName OpenObject -Arguments @{ Id = '{fa926493-6f1c-4193-a414-58f0b2456d1e}' }).Object
  if (-not $o) { throw 'não deu para ler a inicialização do Windows (BCD)' }
  $types = @((Invoke-CimMethod -InputObject $o -MethodName EnumerateElementTypes).Types)
  if ($types -notcontains $type) { return '__none__' }
  $e = (Invoke-CimMethod -InputObject $o -MethodName GetElement -Arguments @{ Type = $type }).Element
  if ($e.CimInstanceProperties['Boolean']) { if ($e.Boolean) { 'yes' } else { 'no' } } else { [string]$e.Integer }
}
Get-CTBcd 0x260000A5
'''
apply = '''
$bl = Get-CimInstance -Namespace root/cimv2/Security/MicrosoftVolumeEncryption -ClassName Win32_EncryptableVolume -ErrorAction SilentlyContinue |
  Where-Object { $_.DriveLetter -eq $env:SystemDrive }
if ($bl -and $bl.ProtectionStatus -eq 1) { manage-bde -protectors -disable $env:SystemDrive -RebootCount 1 | Out-Null }
bcdedit /set disabledynamictick yes | Out-Null
if ($LASTEXITCODE -ne 0) { throw 'bcdedit falhou' }
'''
