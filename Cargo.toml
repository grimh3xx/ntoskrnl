[package]
name = "ntoskrnl"
version = "0.1.0"
edition = "2021"
description = "Windows toolbox for the terminal: tweaks with real undo, app installer, debloat and repairs"
license = "MIT"
repository = "https://github.com/grimh3xx/ntoskrnl"

[dependencies]
anyhow = "1.0.89"
clap = { version = "4.5.20", features = ["derive"] }
ratatui = "0.29.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
toml = "0.8.19"

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"

[build-dependencies]
embed-manifest = "1.4.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
