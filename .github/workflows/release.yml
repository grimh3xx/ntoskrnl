name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash target/release/ntoskrnl.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ntoskrnl.exe" | Set-Content -NoNewline -Encoding ascii ntoskrnl.exe.sha256
          Copy-Item target/release/ntoskrnl.exe .
          Write-Host $h
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} ntoskrnl.exe ntoskrnl.exe.sha256 install.ps1 --title ${{ github.ref_name }} --generate-notes
